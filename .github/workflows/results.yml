name: Check results

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run results
      - name: Save result changes
        run: |
          git diff --quiet -- results.json && exit 0
          git config user.name "fixtures-bot"
          git config user.email "fixtures-bot@users.noreply.github.com"
          git add results.json
          git commit -m "Update results"
          git push

<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tameside Vikings fixtures</title>
  <link rel="icon" href="./logo.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="./logo.png" alt="Tameside Vikings">
      <div>
        <p class="wordmark">Tameside</p>
        <h1>Vikings</h1>
        <p id="checked" class="checked">Loading fixtures…</p>
        <button type="button" id="admin" class="admin-switch" role="switch" aria-checked="false">
          <span>Team admin</span>
          <span class="track" aria-hidden="true"><span class="knob"></span></span>
        </button>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <script type="module" src="./app.js"></script>
</body>
</html>

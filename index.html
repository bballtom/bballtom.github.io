<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Tameside Vikings fixtures</title>
  <script>
    // The iPhone home-screen app keeps the last copy of this page.
    // A new address makes it fetch the page again instead of showing that copy.
    (function () {
      var standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches
      if (!standalone) return
      var params = new URLSearchParams(location.search)
      var fresh = Number(params.get('fresh') || 0)
      if (fresh && Date.now() - fresh < 120000) return
      params.set('fresh', String(Date.now()))
      location.replace(location.pathname + '?' + params.toString() + location.hash)
    })()
  </script>
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=20261108">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="./logo.png" alt="Tameside Vikings">
      <div>
        <p class="wordmark">Tameside</p>
        <h1>Vikings</h1>
        <p id="checked" class="checked">Loading fixtures…</p>
        <button type="button" id="admin" class="admin-switch" role="switch" aria-checked="false">
          <span>Team admin</span>
          <span class="track" aria-hidden="true"><span class="knob"></span></span>
        </button>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <script type="module" src="./app.js?v=20261108"></script>
  <script data-goatcounter="https://tomcrompton.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
